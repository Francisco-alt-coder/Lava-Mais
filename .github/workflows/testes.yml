name: Testes do Lava Mais
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/telas-aprovadas-assistente-ia]
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
