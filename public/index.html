<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1766dc" />
    <meta
      name="description"
      content="Lava Mais: escolha serviços, simule um agendamento e converse com o assistente virtual."
    />
    <title>Lava Mais | Lavagem sem sair de casa</title>
    <link rel="stylesheet" href="/app.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="workspace">
      <div class="phone" aria-label="Aplicação web Lava Mais">
        <div class="phone-screen">
          <header id="header" class="app-header"></header>
          <main id="page" class="page" tabindex="-1"></main>
          <nav id="tabbar" class="tabbar" aria-label="Navegação principal"></nav>
          <button
            id="chatFab"
            class="chat-fab"
            type="button"
            aria-label="Abrir assistente de inteligência artificial"
          ></button>
          <section
            id="chatPanel"
            class="chat-panel hidden"
            role="dialog"
            aria-label="Assistente Lava Mais"
            aria-modal="true"
          >
            <div class="chat-top">
              <span class="chat-avatar" id="chatAvatar"></span>
              <div>
                <strong>Assistente Lava Mais</strong><small id="chatMode">Assistente virtual</small>
              </div>
              <button data-action="close-chat" class="icon-btn" aria-label="Fechar chat">×</button>
            </div>
            <div id="chatMessages" class="chat-messages" aria-live="polite"></div>
            <div class="quick-questions" aria-label="Perguntas sugeridas">
              <button type="button" data-action="pergunta-ia" data-prompt="Quais são os serviços e preços?">Preços</button>
              <button type="button" data-action="pergunta-ia" data-prompt="Como funciona o agendamento?">Como agendar</button>
              <button type="button" data-action="pergunta-ia" data-prompt="Como acompanhar meu pedido?">Meu pedido</button>
            </div>
            <form id="chatForm" class="chat-form">
              <input
                id="chatInput"
                autocomplete="off"
                maxlength="650"
                placeholder="Escreva sua pergunta..."
                aria-label="Mensagem para a IA"
                required
              /><button type="submit" aria-label="Enviar mensagem" id="chatSend"></button>
            </form>
          </section>
          <div id="modal" class="modal-container hidden"></div>
          <div id="toast" class="toast hidden" role="status"></div>
        </div>
      </div>
    </div>
  </body>
</html>
